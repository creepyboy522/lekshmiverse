<!DOCTYPE html>
<html lang="en">
<head>

<title>LekshmiVerse</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Georgia,serif;
background:linear-gradient(to bottom,#07111f,#1a2740,#ffd6e7);
color:white;
overflow-x:hidden;
}

.hero{
height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
padding:20px;
position:relative;
}

h1{

text-shadow:0 0 20px rgba(255,255,255,.6);
}

.subtitle{

margin-top:15px;

}

.moon{
width:150px;
height:150px;
border-radius:50%;
background:#fff7d6;
box-shadow:0 0 60px #fff7d6;
position:absolute;
top:70px;
right:30px;
}

.section{
padding:80px 25px;
}

.card{

margin:auto;
background:rgba(255,255,255,.12);

padding:30px;
border-radius:25px;
border:1px solid rgba(255,255,255,.2);
}

h2{
margin-bottom:20px;
font-size:2rem;
}

p{
line-height:1.8;
font-size:1.1rem;
}

.paths{
display:grid;
gap:20px;
margin-top:25px;
}

.path{
background:rgba(255,255,255,.1);
padding:20px;
border-radius:20px;
}

button{

color:white;
border:none;
padding:15px 25px;
border-radius:50px;
font-size:1rem;
cursor:pointer;
}

#secret{
display:none;
margin-top:20px;
}
