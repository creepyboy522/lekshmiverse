<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LekshmiVerse</title>
    <style>
        /* Base Reset & Cinematic Dark Night Sky Background */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(to bottom, #0B0B1E, #161633, #2C1A30);
            font-family: 'Georgia', serif;
            color: #FFFFFF;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* Twinkling Stars Container */
        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .star {
            position: absolute;
            background-color: #ffffff;
            border-radius: 50%;
            animation: twinkle var(--duration) infinite ease-in-out alternate;
            opacity: var(--opacity);
        }

        @keyframes twinkle {
            0% { opacity: 0.2; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1.2); }
        }

        /* Glowing Moon in Top-Right */
        .moon {
            position: absolute;
            top: 40px;
            right: 40px;
            width: 80px;
            height: 80px;
            background: radial-gradient(circle, #FFFDF0 40%, #FFF5CC 80%);
            border-radius: 50%;
            box-shadow: 0 0 30px rgba(255, 245, 204, 0.6), 0 0 60px rgba(255, 245, 204, 0.3);
            z-index: 1;
        }

        /* Header & Large Glowing Title */
        header {
            text-align: center;
            padding: 80px 20px 40px 20px;
            position: relative;
            z-index: 2;
        }

        .cherry-icon {
            font-size: 2rem;
            animation: float 4s ease-in-out infinite alternate;
            display: inline-block;
            margin: 10px 0;
        }

        h1 {
            font-size: 3.5rem;
            font-weight: 700;
            letter-spacing: 2px;
            color: #FFF0F5;
            text-shadow: 0 0 15px rgba(255, 182, 193, 0.8), 0 0 30px rgba(255, 105, 180, 0.5);
            margin: 15px 0;
        }

        p.subtitle {
            font-style: italic;
            font-size: 1.2rem;
            color: #E0B0FF;
            text-shadow: 0 0 8px rgba(224, 176, 255, 0.5);
        }

        /* Romantic Letter Section */
        .letter-container {
            max-width: 600px;
            margin: 40px auto 80px auto;
            padding: 40px 30px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            color: #332233;
            position: relative;
            z-index: 2;
            transform: translateY(0);
            transition: transform 0.3s ease;
        }

        .letter-container:hover {
            transform: translateY(-5px);
        }

        .letter-header {
            font-size: 1.6rem;
            font-weight: bold;
            color: #5C2C46;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .letter-body {
            font-size: 1.1rem;
            line-height: 1.8;
            text-align: center;
            color: #4A3B4E;
        }

        /* Floating / Falling Animations for Blossoms & Hearts */
        .particle {
            position: fixed;
            pointer-events: none;
            z-index: 3;
            top: -20px;
            animation: fall linear infinite;
        }

        @keyframes fall {
            0% {
                transform: translateY(0) rotate(0deg) translateX(0);
                opacity: 1;
            }
            100% {
                transform: translateY(105vh) rotate(360deg) translateX(var(--drift));
                opacity: 0;
            }
        }

        @keyframes float {
            0% { transform: translateY(0); }
            100% { transform: translateY(-10px); }
        }

        /* Responsive Tweaks */
        @media (max-width: 600px) {
            h1 { font-size: 2.5rem; }
            .moon { width: 60px; height: 60px; top: 20px; right: 20px; }
            .letter-container { margin: 20px; padding: 30px 20px; }
        }
    </style>
</head>
<body>

    <div class="stars" id="starsContainer"></div>

    <div class="moon"></div>

    <header>
        <div class="cherry-icon">🌸</div>
        <h1>LekshmiVerse</h1>
        <div class="cherry-icon">🌸</div>
        <p class="subtitle">A Universe Built From Dreams</p>
    </header>

    <main>
        <div class="letter-container">
            <div class="letter-header">
                💌 <span>Dear Lekshmi</span>
            </div>
            <div class="letter-body">
                <p>We may not have hundreds of photographs together. We may not have years of memories to show. But some people become important long before the memories arrive.</p>
            </div>
        </div>
    </main>

    <script>
        // Generate Dynamic Starfield
        const starsContainer = document.getElementById('starsContainer');
        const numberOfStars = 80;

        for (let i = 0; i < numberOfStars; i++) {
            const star = document.createElement('div');
            star.classList.add('star');
            
            // Randomize positions, sizes, and animation durations
            const size = Math.random() * 3;
            star.style.width = `${size}px`;
            star.style.height = `${size}px`;
            star.style.left = `${Math.random() * 100}%`;
            star.style.top = `${Math.random() * 100}%`;
            star.style.setProperty('--duration', `${2 + Math.random() * 4}s`);
            star.style.setProperty('--opacity', `${0.3 + Math.random() * 0.7}`);
            
            starsContainer.appendChild(star);
        }

        // Generate Falling Sakura Blossoms & Hearts
        const particles = ['🌸', '💝', '✨', '💖', '🌸'];
        
        function createParticle() {
            const particleEl = document.createElement('div');
            particleEl.classList.add('particle');
            
            // Choose a random symbol from the array
            particleEl.innerText = particles[Math.floor(Math.random() * particles.length)];
            
            // Randomize size, horizontal entry, fall duration, and swaying side-to-side drift
            const size = 12 + Math.random() * 16;
            particleEl.style.fontSize = `${size}px`;
            particleEl.style.left = `${Math.random() * 100}vw`;
            
            const duration = 6 + Math.random() * 6;
            particleEl.style.animationDuration = `${duration}s`;
            
            const drift = (Math.random() * 150) - 75; // Left or right sway
            particleEl.style.setProperty('--drift', `${drift}px`);
            
            document.body.appendChild(particleEl);
            
            // Clean up elements after they fall off-screen
            setTimeout(() => {
                particleEl.remove();
            }, duration * 1000);
        }

        // Spawn a new romantic particle every 400ms
        setInterval(createParticle, 400);
    </script>
</body>
</html>
